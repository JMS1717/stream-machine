name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test src/StreamMachine.Tests --nologo
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: stream-machine
          path: dist/*.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StreamMachine-windows-x64.zip
            dist/stream-machine-linux-x64.tar.gz
            dist/install.ps1
            dist/install.sh
